name: Keep App Awake

# Streamlit Community Cloud's free tier puts an app to sleep after a
# period with no incoming traffic -- the next visitor then has to wait
# through a ~30-60s cold start (see README's own "first load after a
# quiet spell" note). A scheduled HTTP GET is the standard, widely-used
# fix: it's genuine inbound traffic, which is what actually resets
# Streamlit Cloud's idle timer, not a full interactive browser session
# specifically. Every 6 hours is a comfortable safety margin under
# whatever the real sleep threshold is (not precisely documented by
# Streamlit, community reports range from about a day to about a week
# of total silence).
#
# A plain `curl -L` (no cookies) FAILS here -- confirmed directly, not
# assumed: this app's own URL redirects through Streamlit Cloud's own
# visitor-identification flow (app -> share.streamlit.io/-/auth/app ->
# a one-time /-/login?payload=... URL -> back to the app), which sets a
# cookie to remember "this visitor already passed through". Without a
# cookie jar to accept and resend it, every hop looks like a brand-new
# visitor and the redirect never terminates -- curl gives up after its
# default 50-redirect cap with exit code 47 ("too many redirects"),
# which is exactly what run #1 of this workflow hit in practice before
# this fix (-c/-b below to persist cookies across the redirect chain,
# confirmed directly to resolve in 3 redirects and a real 200 instead).
#
# Free to run indefinitely: GitHub Actions minutes are unlimited for
# public repos, and this job takes seconds.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:  # manual trigger, e.g. to test this works right after adding it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep Streamlit Cloud from putting it to sleep
        run: |
          curl -sSL --max-time 60 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -c cookies.txt -b cookies.txt \
            -o /dev/null -w "HTTP %{http_code}, %{num_redirects} redirects, %{time_total}s\n" \
            "https://renaissance-polyphony-research-toolkit.streamlit.app/"
